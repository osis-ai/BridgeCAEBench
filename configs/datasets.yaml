# 数据集配置
# -----------------------------------------------------------------------------
# 这是 collect_datasets.py 读的唯一来源。
#
# YAML 写什么 / 怎么填:
#   bridges.<bridge>.visible       # 手挑的代表性最小集 (各桥型 2-4 份, 覆盖各工艺种类)
#   bridges.<bridge>.train | test  # 训练集 / 测试集 (脚本运行时按 train/test 走)
#
# 字段约定:
#   - visible 一定 ⊂ train, 且 ∩ test = ∅
#   - train ∩ test = ∅
#   - train ∪ test = 该桥型全模板
#
# 重切 / 加桥型: 改这份文件后跑 collect_datasets.py 即可。

bridges:
  osis-bridge-cantilever-box:
    visible:
      - 变截面悬浇连续梁-30+50+30          # 变截面·小
      - 变截面悬浇连续梁-50+90+50
      - 变截面悬浇连续梁-55+100+55
      - 变截面悬浇连续梁-80+150+80
    train:
      - 变截面悬浇连续梁-30+50+30
      - 变截面悬浇连续梁-35+60+35
      - 变截面悬浇连续梁-40+70+40
      - 变截面悬浇连续梁-42+75+42          # 新增 2026-07 (测试部 .out 补给)
      - 变截面悬浇连续梁-45+80+45
      - 变截面悬浇连续梁-50+90+50
      - 变截面悬浇连续梁-55+100+55
      - 变截面悬浇连续梁-60+110+60          # 新增 2026-08 (修改梁高-材料底板厚)
      - 变截面悬浇连续梁-62.5+115+62.5     # 测试部认定:115m 跨应为悬浇梁(原归类刚构)
      - 变截面悬浇连续梁-80+150+80
    test:
      - 变截面悬浇连续梁-65+120+65
      - 变截面悬浇连续梁-70+130+70
      - 变截面悬浇连续梁-76+140+76

