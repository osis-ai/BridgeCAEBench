brief: |
  这个模型是按下面的设计参数建的，交给我之前请对照复核：找出模型里和设计参数不一致的地方，逐项改正，改完重建并求解确认能算通。
  设计参数：
  3×20m 先简支后连续预制小箱梁，一联 3 跨，只建一片中梁。
  预制梁架设后浇筑墩顶湿接缝、张拉负弯矩束，体系转换为连续。
  梁高 1.2m。
  主梁 C50。
  荷载：汽车荷载公路-I 级；二期恒载 铺装 10.85kN/m、防撞护栏 2.12kN/m；整体升温 20℃、降温 20℃，考虑正负温度梯度。
  钢束张拉控制应力 1395MPa。
  环境年平均相对湿度 75%。
  回复里给出复核结论 JSON，item 取自：跨径、梁高、汽车荷载等级、整体温度、支座沉降、混凝土等级、二期恒载、张拉控制应力、环境湿度。
  {"inconsistencies":[{"item":"混凝土等级","model":"模型里的值","design":"设计值"}]}
