  钢束张拉控制应力 1395MPa。
  环境年平均相对湿度 75%。
  回复里给出复核结论 JSON，item 取自：跨径、梁高、汽车荷载等级、整体温度、支座沉降、混凝土等级、二期恒载、张拉控制应力、环境湿度。
