brief: |
  这个模型是按下面的设计参数建的，交给我之前请对照复核：找出模型里和设计参数不一致的地方，逐项改正，改完重建并求解确认能算通。
  设计参数：
  56+5×100+56m 变截面预应力混凝土连续刚构，单箱单室，桥宽 12.775m，墩梁固结、双肢薄壁墩，挂篮对称悬臂浇筑，先边跨后中跨合龙。
  根部梁高 6.2m，跨中梁高 2.5m。
  主梁 C55。
  荷载：汽车荷载公路-I 级；二期恒载 11.414kN/m；整体升温 34℃、降温 23℃，考虑正负温度梯度；支座不均匀沉降 10mm。
  钢束张拉控制应力 1395MPa。
  环境年平均相对湿度 70%。
  回复里给出复核结论 JSON，item 取自：跨径、梁高、汽车荷载等级、整体温度、支座沉降、混凝土等级、二期恒载、张拉控制应力、环境湿度。
