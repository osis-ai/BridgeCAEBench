turns:
- from: build-tgirder-006
  brief: |
    建一个计算模型：3×25m 先简支后连续预制 T 梁，一联 3 跨，只建一片中梁。
    预制梁架设后浇筑墩顶湿接缝、张拉负弯矩束，体系转换为连续。
    梁高 1.7m。
    主梁 C50。
    荷载：汽车荷载公路-I 级；二期恒载 铺装 10.85kN/m、防撞护栏 2.12kN/m；整体升温 20℃、降温 20℃，考虑正负温度梯度；支座不均匀沉降 5mm。
    钢束张拉控制应力 1395MPa。
    环境年平均相对湿度 75%。
    建好后重建并求解，确认模型能算通。
  checks:
  - field: span_lengths
    op: approx_list
    value:
    - 25.0
    - 25.0
    - 25.0
    tol: 0.5
  - field: H_mid
    op: approx
