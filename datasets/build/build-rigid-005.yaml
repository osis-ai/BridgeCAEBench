brief: |
  建一个计算模型：56+5×100+56m 变截面预应力混凝土连续刚构，单箱单室，桥宽 12.775m，墩梁固结、双肢薄壁墩，挂篮对称悬臂浇筑，先边跨后中跨合龙。
  根部梁高 6.2m，跨中梁高 2.5m。
  主梁 C55。
  荷载：汽车荷载公路-I 级；二期恒载 11.414kN/m；整体升温 34℃、降温 23℃，考虑正负温度梯度；支座不均匀沉降 10mm。
  钢束张拉控制应力 1395MPa。
  环境年平均相对湿度 70%。
  建好后重建并求解，确认模型能算通。
