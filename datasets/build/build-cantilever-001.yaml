brief: |
  建一个计算模型：65+120+65m 变截面预应力混凝土连续箱梁，单箱单室，桥宽 12.75m，主墩两侧挂篮对称悬臂浇筑，先边跨后中跨合龙。
  根部梁高 7.5m，跨中梁高 3.2m。
  主梁 C60。
  荷载：汽车荷载公路-I 级；二期恒载 中央分隔带 10.3kN/m、人行道 10.5kN/m、铺装 40.125kN/m、防撞护栏 10.2kN/m；整体升温 20℃、降温 20℃，考虑正负温度梯度；支座不均匀沉降主墩 15mm、桥台 10mm。
  钢束张拉控制应力 1395MPa。
  环境年平均相对湿度 75%。
  建好后重建并求解，确认模型能算通。
