- id: kn-faq-001
  question: 盖梁模块验算出计算书时，悬臂外合力的位置 X 是拿来判断要不要用哪种公式验算的？
  answer: 拉压杆公式
  aliases: [拉压杆]
  type: name
  source: {kb: OSIS用户问答记录, knowledge_id: 34a58a2b-c608-46af-8c38-cd9f98a06dd0, title: OSIS常见问题解答.docx,
           excerpt: 用来判断是否需要采用拉压杆公式进行验算}
  status: verified
- id: kn-faq-002
  question: 建模时单元长度小到多少以下会导致算不了？
  answer: 1mm
  aliases: [1毫米, 0.001m]
  type: number
  source: {kb: OSIS用户问答记录, knowledge_id: 34a58a2b-c608-46af-8c38-cd9f98a06dd0, title: OSIS常见问题解答.docx,
           excerpt: 如果单位长度过小（＜1mm）会导致无法计算}
  status: verified
- id: kn-faq-003
  question: 用盖梁快速建模算悬臂盖梁，悬臂端位移特别大，模型里最该先查的是哪种简化？
