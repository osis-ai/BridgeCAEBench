brief: |
  这个项目是同事做到一半交给我的：控制参数、钢束线形、材料、截面、节点、单元已经建好（prep/_1～_6），边界、荷载、活载分析和施工阶段还没做，main.py 已经写好调用顺序。请接着补完，不要改动已经做好的部分，最后重建并求解确认能算通。
  设计参数：
  - 汽车荷载公路-I 级，车道数 1
  - 二期恒载 铺装 10.85kN/m、防撞护栏 2.12kN/m
  - 整体升温 20℃、降温 20℃，考虑正负温度梯度
  - 钢束张拉控制应力 1395MPa
  - 施工阶段（共 7 个）：主梁预制、张拉正弯矩束 → 存梁 → 墩顶现浇段施工、张拉负弯矩束 → 体系转换 → 二期恒载 → 徐变十年 → 运营阶段
