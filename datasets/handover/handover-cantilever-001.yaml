id: handover-cantilever-001
line: handover
bridge: osis-bridge-cantilever-box
status: verified
version: 1
kind: A
start: overlay:start
base: 变截面悬浇连续梁-65+120+65
reference: template:变截面悬浇连续梁-65+120+65
hide_templates:
- 变截面悬浇连续梁-65+120+65
brief: |
  这个项目是同事做到一半交给我的：控制参数、钢束线形、材料、截面、节点、单元已经建好（prep/_1～_6），边界、荷载、活载分析和施工阶段还没做，main.py 已经写好调用顺序。请接着补完，不要改动已经做好的部分，最后重建并求解确认能算通。
  设计参数：
  - 汽车荷载公路-I 级，车道数 6
  - 支座不均匀沉降主墩 15mm、桥台 10mm
  - 二期恒载 中央分隔带 10.3kN/m、人行道 10.5kN/m、铺装 40.125kN/m、防撞护栏 10.2kN/m
  - 整体升温 20℃、降温 20℃，考虑正负温度梯度
  - 钢束张拉控制应力 1395MPa
  - 施工阶段（共 50 个）：0号段施工 → 1号段挂篮 → 1号段浇筑 → …… → 中跨1合龙 → 体系转换 → 二期恒载 → 徐变十年 → 运营阶段
hidden:
  lane_count: 6
  settlement_mm:
  - 10.0
  - 15.0
  uniform_temp:
  - -20.0
  - 20.0
  tendon_stress:
  - 1395000000.0
  stage_count: 50
